India is a country located in South Asia.
It is the seventh-largest country in the world by land area.
India is the most populous country in the world, with over 1.4 billion people.
The capital city of India is New Delhi.
India gained independence from British rule on 15 August 1947.
The Constitution of India came into effect on 26 January 1950, celebrated as Republic Day.
India is a democratic republic with a parliamentary system of government.
The official languages of the Union are Hindi and English for official purposes, while the country recognizes many other languages.
India has 28 states and 8 Union Territories.
The currency of India is the Indian Rupee (INR).
India is known for its rich cultural heritage, traditions, and festivals such as Diwali, Holi, Eid, Christmas, and Durga Puja.
The Taj Mahal, located in Agra, is one of the Seven Wonders of the World.
The Himalayas, the world's highest mountain range, lie in the northern part of India.
India has a diverse climate, ranging from tropical in the south to alpine in the Himalayan regions.
Agriculture, information technology, manufacturing, and services are major contributors to India's economy.
India is one of the world's leading producers of tea, spices, rice, and cotton.
The country has made significant achievements in space exploration through the Indian Space Research Organisation (ISRO).
Cricket is the most popular sport in India, although hockey is the country's national sport in terms of historical significance.
India is home to a wide variety of wildlife, including tigers, elephants, lions, peacocks, and rhinoceroses.
India is famous for its unity in diversity, where people of different religions, languages, and cultures live together.